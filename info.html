<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="icon-512.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="info.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <span id="main">
        <div id="logo">
        </div>
        <div id="content">
            <h1 id="i">Get Started</h1>
            <form action="" id="form">
                <div id="collect">
                    <label id="t" class="space" for="name">Full Name</label><br>
                    <input class="input" id="name" type="text" placeholder="Divit Jain" required><br><br>

                    <label id="t" class="space" for="un">Email Address</label><br>
                    <input class="input" id="un" type="email" placeholder="notemaker.official@gmail.com" required><br><br>

                    <label id="t" for="phno">Password</label><br>
                    <input id="phno" class="input" type="password" placeholder="Use a strong Password"><br><br>

                </div><br>
                <h5>Please enter all the credentials appropriately as they may be used for future verification. <br>Have an account? <a href="index.html">Sign In</a></h5>
                <button id="submit" type="submit" src="">Submit</button>
            </form>
            <div id="or">
                <span>OR</span>
            </div><br>
            <div id="apps">
                <div id="google" class="app">
                    <img src="Platform=Google, Color=Original.png" alt="">
                </div>
                <div id="fb" class="app">
                    <img src="Platform=Facebook, Color=Original.svg" alt="">
                </div>
                <div id="aaple" class="app">
                    <img src="Platform=Apple, Color=Original.png" alt="">
                </div>
            </div>
        </div>
    </span>
    <div id="img">
        <h4 id="quotes"></h4>
    </div>
    <script src="info.js"></script>
</body>
</html>
